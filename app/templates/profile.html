{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] w-full px-4 page-transition">
    <div
        class="w-full max-w-md p-8 space-y-6 bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-[0_0_30px_rgba(45,212,191,0.1)] transition-all duration-500 hover:border-teal-500/30 hover:shadow-[0_0_40px_rgba(45,212,191,0.2)]">

        <div class="text-center">
            <h2
                class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-violet-400">
                Account Settings
            </h2>
            <p class="mt-2 text-sm text-gray-400">Update your profile details and security.</p>
        </div>

        <form method="POST" action="{{ url_for('main.profile') }}" class="space-y-5 mt-8">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">FULL NAME</label>
                <input type="text" name="name" value="{{ current_user.name }}" required
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all duration-300">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">CURRENT PASSWORD</label>
                <input type="password" name="current_password"
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 transition-all"
                    placeholder="Required if changing password">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">EMAIL ADDRESS</label>
                <input type="email" name="email" value="{{ current_user.email }}" required
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all duration-300">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">NEW PASSWORD</label>
                <input type="password" name="new_password"
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all duration-300"
                    placeholder="Leave blank to keep current password">
            </div>

            <button type="submit"
                class="w-full py-3.5 mt-6 font-bold text-white rounded-full bg-gradient-to-r from-teal-500 to-violet-600 hover:from-teal-400 hover:to-violet-500 shadow-lg hover:shadow-teal-500/25 transition-all duration-300 transform hover:-translate-y-0.5">
                Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
