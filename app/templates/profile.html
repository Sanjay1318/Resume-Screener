{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto mt-12 fade-in">
    
    <div class="mb-8">
        <h1 class="text-3xl font-bold text-white mb-2">Account Settings</h1>
        <p class="text-cybergray text-sm">Manage your security credentials and profile details.</p>
    </div>

    <!-- The Cyber-Card Form -->
    <div class="bg-cybercard border border-cyberborder p-8 rounded-3xl shadow-2xl relative overflow-hidden">
        
        <!-- Subtle Glow Effect from the image -->
        <div class="absolute -top-24 -right-24 w-64 h-64 bg-cyberteal rounded-full mix-blend-screen filter blur-[80px] opacity-10"></div>

        <form action="{{ url_for('main.profile') }}" method="POST" class="space-y-6 relative z-10">
            
            <!-- Read-Only Name -->
            <div>
                <label class="block text-xs font-medium text-cybergray uppercase tracking-wider mb-2">Full Name</label>
                <div class="px-4 py-3 bg-cyberbg border border-cyberborder rounded-xl text-gray-500 text-sm">
                    {{ current_user.name }} <span class="ml-2 text-xs text-cyberborder">(Cannot be changed)</span>
                </div>
            </div>

            <!-- Email Update -->
            <div>
                <label for="email" class="block text-xs font-medium text-cybergray uppercase tracking-wider mb-2">Email Address</label>
                <input type="email" name="email" id="email" value="{{ current_user.email }}" required
                       class="block w-full bg-cyberbg border border-cyberborder rounded-xl text-white shadow-sm focus:border-cyberteal focus:ring-1 focus:ring-cyberteal sm:text-sm p-3 transition-colors outline-none">
            </div>

            <hr class="border-cyberborder my-6">

            <!-- Password Update -->
            <div>
                <label for="new_password" class="block text-xs font-medium text-cybergray uppercase tracking-wider mb-2">New Password</label>
                <input type="password" name="new_password" id="new_password" placeholder="Leave blank to keep current password"
                       class="block w-full bg-cyberbg border border-cyberborder rounded-xl text-white shadow-sm focus:border-cyberteal focus:ring-1 focus:ring-cyberteal sm:text-sm p-3 transition-colors outline-none placeholder-gray-600">
                <p class="mt-2 text-xs text-cybergray">Only fill this out if you wish to change your current password.</p>
            </div>

            <!-- Submit Button (Pill shaped like the image) -->
            <div class="pt-4">
                <button type="submit" 
                        class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-[0_0_15px_rgba(20,241,217,0.15)] text-sm font-bold text-cyberbg bg-cyberteal hover:bg-teal-400 focus:outline-none transition-all duration-300">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
