{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] w-full px-4 page-transition">
    <div class="w-full max-w-md p-8 space-y-6 bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-[0_0_30px_rgba(45,212,191,0.1)] transition-all duration-500 hover:border-teal-500/30 hover:shadow-[0_0_40px_rgba(45,212,191,0.2)]">
        
        <div class="text-center">
            <h2 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-violet-400">
                Security Check
            </h2>
            <p class="mt-2 text-sm text-gray-400">We have sent a 6-digit code to your email.</p>
        </div>

        <form method="POST" action="{{ url_for('auth.verify_otp') }}" class="space-y-5 mt-8">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1 text-center">AUTHENTICATION CODE</label>
                <input type="text" name="otp_code" required maxlength="6" pattern="\d{6}"
                       class="w-full px-4 py-4 text-center tracking-[0.75em] text-3xl font-bold bg-slate-900/80 border border-white/10 rounded-xl text-teal-400 placeholder-gray-700 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all duration-300"
                       placeholder="••••••">
            </div>

            <button type="submit" 
                    class="w-full py-3.5 mt-6 font-bold text-white rounded-full bg-gradient-to-r from-teal-500 to-violet-600 hover:from-teal-400 hover:to-violet-500 shadow-lg hover:shadow-teal-500/25 transition-all duration-300 transform hover:-translate-y-0.5">
                Verify & Login
            </button>
        </form>

        <p class="text-sm text-center text-gray-400 mt-6">
            Didn't receive the code? 
            <a href="{{ url_for('auth.login') }}" class="font-medium text-teal-400 hover:text-teal-300 transition-colors duration-300">Try again</a>
        </p>
    </div>
</div>
{% endblock %}
