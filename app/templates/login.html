{% extends "base.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[70vh] w-full px-4">
    <!-- Dark Floating Card with Neon Glow -->
    <div
        class="w-full max-w-md p-8 space-y-6 bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl shadow-[0_0_30px_rgba(45,212,191,0.1)] transition-all duration-500 hover:border-teal-500/30 hover:shadow-[0_0_40px_rgba(45,212,191,0.2)]">

        <div class="text-center">
            <h2
                class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-violet-400">
                Welcome Back
            </h2>
            <p class="mt-2 text-sm text-gray-400">Sign in to access your dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-5 mt-8">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-1">Email Address</label>
                <input type="email" name="email" required
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all duration-300"
                    placeholder="Enter your email">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-gray-300">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}"
                        class="text-xs text-teal-400 hover:text-teal-300 transition-colors duration-300">Forgot
                        password?</a>
                </div>

                <input type="password" name="password" required
                    class="w-full px-4 py-3 bg-slate-900/50 border border-white/10 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition-all duration-300"
                    placeholder="Enter your password">
            </div>

            <!-- Pill-Shaped Teal Button -->
            <button type="submit"
                class="w-full py-3.5 mt-4 font-bold text-white rounded-full bg-gradient-to-r from-teal-500 to-violet-600 hover:from-teal-400 hover:to-violet-500 shadow-lg hover:shadow-teal-500/25 transition-all duration-300 transform hover:-translate-y-0.5">
                Sign In
            </button>
        </form>

        <p class="text-sm text-center text-gray-400 mt-6">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}"
                class="font-medium text-teal-400 hover:text-teal-300 transition-colors duration-300">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
